<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/nahin-portfolio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nahin_portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>nahin_portfolio</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts for premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #030712;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0b0f19 0%, #030712 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Outfit', sans-serif;
    }
    #loading-indicator.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .loading-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .loader-circle {
      position: relative;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 20%, #2dd4bf 60%, #6366f1 100%);
      animation: rotate 1s linear infinite;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(45, 212, 191, 0.15), 0 0 40px rgba(99, 102, 241, 0.1);
    }
    .loader-circle::before {
      content: '';
      position: absolute;
      width: 62px;
      height: 62px;
      background: #030712;
      border-radius: 50%;
    }
    .loading-text {
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      animation: pulseText 2s ease-in-out infinite;
    }
    .loading-subtext {
      color: #64748b;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    @keyframes pulseText {
      0%, 100% {
        opacity: 0.7;
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 8px rgba(45, 212, 191, 0.4));
      }
    }
  </style>
</head>

<body>
  <!-- Custom premium splash screen loader -->
  <div id="loading-indicator">
    <div class="loading-wrapper">
      <div class="loader-circle"></div>
      <div class="loading-text">Jubaer Nahin</div>
      <div class="loading-subtext">Loading Portfolio</div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
